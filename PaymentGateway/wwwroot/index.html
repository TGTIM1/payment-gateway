<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Payment Gateway TWA</title>
    <!-- Официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <!-- Шапка с профилем пользователя -->
    <header class="user-header">
        <div class="user-info">
            <span id="user-name">Загрузка профиля...</span>
            <span id="user-badge" class="badge">Telegram Auth</span>
        </div>
    </header>

    <main class="container">
        <!-- Форма создания платежа -->
        <section class="card">
            <h2>Новый платёж</h2>
            <form id="payment-form">
                <div class="form-group">
                    <label for="amount">Сумма</label>
                    <input type="number" id="amount" placeholder="100.00" step="0.01" required min="1">
                </div>

                <div class="form-group">
                    <label for="currency">Валюта</label>
                    <select id="currency">
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="RUB">RUB</option>
                        <option value="UZS">UZS</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Описание (опционально)</label>
                    <input type="text" id="description" placeholder="Оплата заказа #1234">
                </div>

                <button type="submit" id="pay-btn" class="btn">Оплатить</button>
            </form>
        </section>

        <!-- Список проведенных платежей -->
        <section class="card">
            <h2>История транзакций</h2>
            <div id="payments-list">
                <p class="empty-text">История пока пуста или загружается...</p>
            </div>
        </section>
    </main>
</div>

<!-- В параметр v=... передан временно cache-buster для сброса кэша Telegram -->
<script src="app.js?v=200"></script>
</body>
</html>
